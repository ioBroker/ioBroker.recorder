version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 15
    versioning-strategy: "increase-if-necessary"
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
